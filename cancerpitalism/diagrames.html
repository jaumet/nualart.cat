<h1>Catàleg de diagrames</h1>
<p class="intro-note">Els 76 diagrames centrals del llibre. Sota cada un: el títol del node, el missatge central i la descripció del dibuix.</p>
<div class="grid" id="grid"></div>
<script type="module">
  import { translateDom, mountLangSwitch } from "./src/i18n.js";
  import { loadToc } from "./src/toc-loader.js";
  import { DIAGRAM_SPECS } from "./src/diagram-specs.js";
  import { renderDiagram, DEFS } from "./src/diagrams.js";
  import { renderIllustration } from "./src/illustrations.js";
  translateDom();
  mountLangSwitch(document.querySelector(".top-actions"));
  const book = await loadToc();
  document.querySelector("#grid").innerHTML = book.nodes.map((node, i) => `<figure><svg id="growth-system" viewBox="0 0 800 800" role="img" aria-label="${node.diagram}">${DEFS}${renderIllustration(node.order) || renderDiagram(DIAGRAM_SPECS[i])}</svg><figcaption><b>${String(node.order).padStart(2,"0")} · ${node.title}</b>${node.center.text}<i>${node.diagram}</i></figcaption></figure>`).join("");
  document.body.dataset.ready = "1";
</script>
</body>
